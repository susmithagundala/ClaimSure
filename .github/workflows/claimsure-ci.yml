name: ClaimSure CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: insurance_fraud_db
          POSTGRES_USER: claimsure
          POSTGRES_PASSWORD: claimsure-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claimsure -d insurance_fraud_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/insurance_fraud_db
      DB_USERNAME: claimsure
      DB_PASSWORD: claimsure-ci-password
      JWT_SECRET: Q2xhaW1TdXJlLUNJLW9ubHktc2VjcmV0LWtleS0zMi1ieXRlcyE=
      JWT_EXPIRATION_MS: 3600000
      S3_ENABLED: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test backend
        working-directory: insurance-fraud-backend
        run: mvn -B test

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: insurance-fraud-frontend/package-lock.json

      - name: Install dependencies
        working-directory: insurance-fraud-frontend
        run: npm ci

      - name: Build frontend
        working-directory: insurance-fraud-frontend
        run: npm run build

  etl:
    name: ETL Docker Image Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build ETL Docker image
        run: docker build -t claimsure-etl:ci ./insurance-fraud-etl
