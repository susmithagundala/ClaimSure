name: ClaimSure CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test backend
        working-directory: insurance-fraud-backend
        run: mvn -B test

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: insurance-fraud-frontend/package-lock.json

      - name: Install dependencies
        working-directory: insurance-fraud-frontend
        run: npm ci

      - name: Build frontend
        working-directory: insurance-fraud-frontend
        run: npm run build

  etl:
    name: ETL Docker Image Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build ETL Docker image
        run: docker build -t claimsure-etl:ci ./insurance-fraud-etl
